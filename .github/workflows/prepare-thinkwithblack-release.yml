name: Validate free teaching materials
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-public-skills.py
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/build-free-edition.py package --output "${{ runner.temp }}/free-materials"
      - uses: actions/upload-artifact@v4
        with:
          name: thinkwithblack-free-materials
          path: ${{ runner.temp }}/free-materials
